# Test on every push to main and every pull request -- and on every release
# tag, when publish.yml calls this workflow and publishes only if it passes.
#
# Run on main, it finds a failure while a fix is still cheap; run on the tag,
# it decides whether the release happens at all. mypy is gated alongside the
# tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same ref makes an in-flight run pointless; drop it.
# github.workflow names the caller when publish.yml runs this, so a release's
# run has a group of its own: no other run on the tag can cancel it, which
# would skip the publish without a word.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # An exact release where checkout takes a major: setup-uv stopped
      # publishing floating tags at v8, so `@v10` would not resolve. Its
      # releases are immutable, so this tag cannot be moved under us either.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q
