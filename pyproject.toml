[project]
name = "podpack-notes"
version = "0.1.0"
description = "A small notes app for podpack sites, and the worked example of one"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["podpack"]

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# The distribution is `podpack-notes` and the import name `podpack_notes`, while
# the app answers to `notes` -- its blueprint's name, which is what keys
# [apps.notes], [site.mounts] and the directories on disk. Three spellings of
# one thing, which is a wart the framework documents rather than hides.
[tool.uv.build-backend]
module-name = "podpack_notes"

[tool.uv.sources]
# git rather than a sibling path, and the distinction is not cosmetic: uv honours
# a dependency's own sources when it resolves it, so a path here is interpreted
# inside *this* package's checkout by anyone who installs it. A consumer got
#
#   git+https://github.com/holdenweb/podpack-notes.git#subdirectory=../podpack
#   has no subdirectory `../podpack`
#
# which is this line leaking into their resolution. A path source in a published
# package is not a local convenience; it is a defect in what you publish.
#
# To work on both repositories at once, install the sibling over the top:
#
#     uv sync --all-groups && uv pip install -e ../podpack
podpack = { git = "https://github.com/holdenweb/podpack.git" }

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.11"]

[tool.mypy]
files = ["src", "tests"]
ignore_missing_imports = true
