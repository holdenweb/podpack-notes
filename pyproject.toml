[project]
name = "podpack-notes"
version = "0.1.3+dev"
description = "A small notes app for podpack sites, and the worked example of one"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
# flask-wtf arrives transitively today, since flask-security depends on it and
# podpack installs flask-security on every site. Declared anyway: this app now
# imports it directly, and a dependency held only by somebody else's dependency
# is one refactor upstream from vanishing. podpack-pdf and podpack-qrcode
# declare the same pair.
dependencies = ["flask-wtf>=1.2.1", "wtforms>=3.0"]

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# The distribution is `podpack-notes` and the import name `podpack_notes`, while
# the app answers to `notes` -- its blueprint's name, which is what keys
# [apps.notes], [site.mounts] and the directories on disk. Three spellings of
# one thing, which is a wart the framework documents rather than hides.
[tool.uv.build-backend]
module-name = "podpack_notes"

# podpack is deliberately absent from `dependencies`, for the same reason it is
# absent from pp-pdf's: declaring it binds at *lock* time. Here it also creates a
# circle that cannot be resolved at all -- podpack's own lab installs this app,
# so podpack depends on podpack-notes, and uv then sees two different URLs for
# podpack (the local project, and whatever this file names) and refuses:
#
#   Requirements contain conflicting URLs for package `podpack`:
#     - file:///Users/sholden/sites/podpack (editable)
#     - git+https://github.com/holdenweb/podpack.git
#
# An app is loaded *by* podpack, so podpack is present by construction wherever
# this app runs. A site installs both, and says so in its own pyproject.
#
# Install it into the venv for development, leaving the lock alone:
#
#     uv sync --all-groups && uv pip install -e ../podpack

[dependency-groups]
# podpack is here rather than in `dependencies`: an app must not pin the
# framework version of the site installing it. A dependency group is dev-only
# metadata and constrains nobody downstream.
#
# From the repository, so `uv sync` works on any machine and in CI, which is
# now what publishes this package. It was previously opted into by hand with
# `uv pip install -e ../podpack`, which needed a sibling checkout.
dev = ["pytest>=8.0", "mypy>=1.11", "podpack"]

[tool.uv.sources]
podpack = { git = "https://github.com/holdenweb/podpack.git" }

[tool.mypy]
files = ["src", "tests"]
ignore_missing_imports = true
